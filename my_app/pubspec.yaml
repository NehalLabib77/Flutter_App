name: educompass
description: "AI-Powered Course Recommendation System — Flutter mobile client."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  # flutter_secure_storage intentionally NOT used — its Windows plugin
  # requires the ATL C++ headers from Visual Studio. The StorageService
  # falls back to shared_preferences on every platform.
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  url_launcher_platform_interface: ^2.3.2
  app_links: ^6.3.2
  shared_preferences: ^2.3.2
  # Firebase Authentication is the identity/verification layer and
  # Cloud Firestore mirrors enrollment state; Flask still issues the app JWT
  # and owns recommendation/payment APIs.
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
       
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"