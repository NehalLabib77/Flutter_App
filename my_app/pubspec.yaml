name: course_recommendation_app
description: "AI-Powered Course Recommendation System — Flutter mobile client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  # flutter_secure_storage intentionally NOT used — its Windows plugin
  # requires the ATL C++ headers from Visual Studio. The StorageService
  # falls back to shared_preferences on every platform.
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  # Firebase packages are kept in case cloud sync is reintroduced, but
  # auth and profile storage now go through the Flask backend (see
  # `lib/api_client.dart` and `lib/app_state.dart`). The FlutterFire
  # versions here are pinned to the 3.x / 4.x / 5.x lines that match
  # current FlutterFire tooling.
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
