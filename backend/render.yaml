services:
  - type: web
    name: educompass-api
    runtime: python
    plan: free

    buildCommand: |
      pip install --upgrade pip &&
      pip install -r backend/requirements.txt

    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT --workers 1 --timeout 180 "run:app"

    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      - key: FLASK_ENV
        value: production

      - key: PYTHON_VERSION
        value: 3.11.9

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS
        value: "*"

      - key: AUTO_CREATE_DB
        value: "true"

      # Point the loader at the lightweight v4 bundle.
      - key: MODEL_DIR
        value: /opt/render/project/src/ml/artifacts/models/v4

      - key: DATABASE_URL
        fromDatabase:
          name: educompass-db
          property: connectionString

      - key: PAYMENT_MODE
        value: sandbox

      - key: SSLC_STORE_ID
        sync: true

      - key: SSLC_STORE_PASSWORD
        sync: true

      - key: PUBLIC_BASE_URL
        value: https://<educompass-backend-service>.onrender.com

      - key: APP_RETURN_URI
        value: educompass://payment/return

databases:
  - name: educompass-db
    plan: free
    databaseName: educompass
    user: educompass
