services:
  - type: web
    name: educompass-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      mkdir -p models &&
      cp -r ../ml/artifacts/models/. models/ 2>/dev/null || true
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 "run:app"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: AUTO_CREATE_DB
        value: "true"

databases:
  - name: educompass-db
    plan: free
    databaseName: educompass
    user: educompass